# deskd-spike: retired source example with placeholder paths; do not deploy.
# Modified in the independent deskd-spike fork; see MODIFICATIONS.md for provenance and limits.
# codex-deskd in-process wire shim (codex-rs/desk-shim). Read by the CLI at
# startup from $CODEX_HOME/desk_shim.toml; kept out of config.toml because Codex
# warns about configuration keys it does not recognise.
port = 8397
gemini_key_file = "/path/to/deskd-spike/keys/gemini"
models_json = "/path/to/deskd-spike/desk/gemini-models.json"
# upstream = "https://chatgpt.com"      # origin for non-gemini traffic
# gemini_prefix = "gemini-"             # model slugs translated to Gemini
# dump_dir = "/abs/path"                # record every translated request
